services:
  - type: web
    name: flask-video-generator
    runtime: python
    buildCommand: |
      pip install --upgrade pip setuptools wheel
      pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: PIP_NO_CACHE_DIR
        value: 1
